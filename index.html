<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ESCAPE AI" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>GOLF ESCAPE AI</title>
    <style>
      /* 画面の上下は、ノッチやホームバーを避ける余白（セーフエリア）を取る。
         読み込み順に左右されないよう、アプリ本体のCSSより強いセレクターで指定する。 */
      html:root {
        box-sizing: border-box;
        height: 100%;
        padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
        background: #000;
      }
      @supports (height: 100dvh) {
        html:root {
          height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- pages-redirect:start -->
    <script>
      // このファイルは開発用の入口で、そのままではブラウザーで動かない。
      // GitHub Pages がリポジトリ直下を公開している場合は、ビルド済みの docs/ へ移動する。
      // （ビルド後のファイルでは上の main.tsx の読み込みが置き換わるため、この移動は起きない）
      if (/\.github\.io$/.test(location.hostname) && document.querySelector('script[src$="/src/main.tsx"]')) {
        location.replace('./docs/');
      }
    </script>
    <!-- pages-redirect:end -->
  </body>
</html>
