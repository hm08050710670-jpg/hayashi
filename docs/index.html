<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ESCAPE AI" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>GOLF ESCAPE AI</title>
    <link rel="stylesheet" href="./assets/app-RHGGB47A.css" />
    <style>
      /* 画面の上下は、ノッチやホームバーを避ける余白（セーフエリア）を取る。
         読み込み順に左右されないよう、アプリ本体のCSSより強いセレクターで指定する。 */
      html:root {
        box-sizing: border-box;
        height: 100%;
        padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
        background: #000;
      }
      @supports (height: 100dvh) {
        html:root {
          height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./assets/app-E3QHTQG7.js"></script>
  </body>
